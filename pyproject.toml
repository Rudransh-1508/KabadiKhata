[project]
name = "kabadi-khata"
version = "0.1.0"
description = "Proof-of-collection ledger for informal recyclers, with an EPR fraud radar"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "strands-agents[gemini]>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mangum>=0.19",
    "opensearch-py>=2.7",
]

[project.optional-dependencies]
openai = ["strands-agents[openai]>=1.50"]
dev = ["pytest>=8", "httpx>=0.27", "honcho>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
